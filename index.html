<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>SmartList Pro — Абсолютная защита</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #005fb8;
            --gradient: linear-gradient(135deg, #005fb8, #6366f1);
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --radius: 22px;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; }
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body {
            font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text);
            margin: 0; padding: env(safe-area-inset-top) 16px 120px 16px;
        }

        .app-container { width: 100%; max-width: 500px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; }
        h1 { font-size: 26px; font-weight: 800; margin: 0; color: #6366f1; letter-spacing: -1px; }

        /* ИНДИКАТОР ЗАГРУЗКИ */
        #aiStatus { display: none; font-size: 11px; color: #6366f1; text-align: center; margin-bottom: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }

        /* СИНЕЕ ОКНО РЕЦЕПТА (Над полем ввода) */
        #recipeCard {
            background: var(--gradient);
            color: white; border-radius: var(--radius);
            padding: 22px; margin-bottom: 16px;
            box-shadow: 0 12px 25px rgba(99, 102, 241, 0.4);
            display: none; position: relative;
            animation: slideDown 0.5s ease-out;
            z-index: 5;
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .recipe-card h3 { margin: 0 0 10px 0; font-size: 19px; display: flex; align-items: center; gap: 8px; font-weight: 700; }
        .recipe-card p { margin: 0; font-size: 14.5px; line-height: 1.6; white-space: pre-line; opacity: 0.95; }
        .recipe-close { position: absolute; top: 18px; right: 18px; cursor: pointer; font-size: 24px; width: 32px; height: 32px; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: 0.2s; }
        .recipe-close:active { transform: scale(0.9); }

        /* ПОЛЕ ВВОДА */
        .input-group {
            position: sticky; top: 10px; z-index: 1000;
            background: var(--card); padding: 8px; border-radius: var(--radius);
            box-shadow: var(--shadow); display: flex; align-items: center; gap: 4px;
            margin-bottom: 20px;
        }
        input { flex: 1; border: none; background: transparent; padding: 12px; font-size: 16px; color: var(--text); font-weight: 500; }
        
        .btn { border: none; background: none; cursor: pointer; border-radius: 14px; display: flex; align-items: center; justify-content: center; transition: 0.2s; font-size: 22px; }
        .btn-mic.active { color: #ef4444; animation: pulse 1s infinite; }
        .btn-reset { color: var(--muted); display: none; }
        .btn-reset.show { display: block; }
        .btn-add { background: #6366f1; color: white; padding: 12px 18px; font-weight: 700; font-size: 16px; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }

        /* ШАБЛОНЫ СО СТРЕЛКАМИ */
        .nav-container { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; }
        .scroll-box { display: flex; gap: 8px; overflow-x: auto; scroll-behavior: smooth; scrollbar-width: none; width: 100%; padding: 4px 0; }
        .scroll-box::-webkit-scrollbar { display: none; }
        .arrow { background: var(--card); border: none; width: 36px; height: 36px; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.1); color: #6366f1; font-weight: bold; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .arrow:active { transform: scale(0.9); }

        .chip { background: var(--card); padding: 12px 18px; border-radius: 50px; white-space: nowrap; font-size: 13px; font-weight: 600; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; transition: 0.2s; }
        .chip:active { background: #e0e7ff; }

        /* СПИСОК */
        .list { display: flex; flex-direction: column; gap: 12px; padding: 0; margin: 0; list-style: none; }
        .item { background: var(--card); padding: 18px; border-radius: var(--radius); display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .item.done { opacity: 0.4; order: 100; filter: grayscale(1); }
        .item.done .item-name { text-decoration: line-through; }
        .item-info { flex: 1; cursor: pointer; }
        .item-name { font-weight: 600; font-size: 16px; display: block; margin-bottom: 2px; }
        .item-cat { font-size: 11px; color: var(--muted); font-weight: 800; text-transform: uppercase; }
        .btn-del { color: #f87171; font-size: 18px; border: none; background: none; padding: 8px; cursor: pointer; }

        /* ПОДСКАЗКИ */
        .suggestions { position: absolute; top: 70px; left: 0; right: 0; background: var(--card); border-radius: 18px; box-shadow: var(--shadow); display: none; z-index: 1100; overflow: hidden; border: 1px solid rgba(0,0,0,0.05); }
        .s-item { padding: 16px; border-bottom: 1px solid rgba(0,0,0,0.05); display: flex; justify-content: space-between; cursor: pointer; font-weight: 500; }

        .footer { margin-top: 50px; text-align: center; }
        .btn-clear { background: none; border: none; color: var(--muted); text-decoration: underline; font-weight: 600; font-size: 13px; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>SmartList Pro</h1>
        <button class="btn" style="background: var(--card); box-shadow: var(--shadow); padding: 10px;" onclick="showStats()">📊</button>
    </header>

    <div id="aiStatus">ШЕФ-ПОВАР СОСТАВЛЯЕТ РЕЦЕПТ...</div>

    <!-- СИНЕЕ ОКНО РЕЦЕПТА (ГАРАНТИРОВАННО НАД ВВОДОМ) -->
    <div id="recipeCard" class="recipe-card">
        <span class="recipe-close" onclick="closeRecipe()">×</span>
        <h3>👨‍🍳 Ваш рецепт</h3>
        <p id="recipeContent"></p>
    </div>

    <!-- ПОЛЕ ВВОДА ЗАПРОСОВ -->
    <div class="input-group">
        <button id="micBtn" class="btn btn-mic" onclick="toggleVoice()">🎤</button>
        <button class="btn" onclick="useMagicAI()" title="Умный Анализ">✨</button>
        <input type="text" id="mainInput" placeholder="Все для борща..." autocomplete="off">
        <button id="resetBtn" class="btn btn-reset" onclick="clearInput()">✕</button>
        <button class="btn btn-add" onclick="manualAdd()">+</button>
        <div id="suggestBox" class="suggestions"></div>
    </div>

    <!-- ПАНЕЛЬ КНОПОК СО СТРЕЛКАМИ -->
    <div class="nav-container">
        <button class="arrow" onclick="scrollTags(-120)">‹</button>
        <div class="scroll-box" id="tagScroll">
            <div class="chip" onclick="useMagicAI('Рецепт Борща')">🍲 Борщ</div>
            <div class="chip" onclick="useMagicAI('Рецепт Плова')">🍚 Плов</div>
            <div class="chip" onclick="useMagicAI('Рецепт Блинов')">🥞 Блины</div>
            <div class="chip" onclick="addSet('breakfast')">🍳 Завтрак</div>
            <div class="chip" onclick="addSet('bbq')">🔥 Шашлыки</div>
            <div class="chip" onclick="useMagicAI('Паста Карбонара')">🍝 Карбонара</div>
            <div class="chip" onclick="addSet('cleaning')">🧹 Уборка</div>
        </div>
        <button class="arrow" onclick="scrollTags(120)">›</button>
    </div>

    <ul id="list" class="list"></ul>

    <div class="footer">
        <button class="btn-clear" onclick="fullReset()">Очистить список и закрыть рецепт</button>
    </div>
</div>

<script>
    // --- ПЕРЕМЕННЫЕ И ХРАНИЛИЩЕ ---
    let items = JSON.parse(localStorage.getItem('sl_bulletproof_items')) ||[];
    let history = JSON.parse(localStorage.getItem('sl_bulletproof_history')) || {};
    let currentRecipe = localStorage.getItem('sl_bulletproof_recipe') || "";

    const mainInput = document.getElementById('mainInput');
    const resetBtn = document.getElementById('resetBtn');
    const suggestBox = document.getElementById('suggestBox');
    const micBtn = document.getElementById('micBtn');
    const recipeCard = document.getElementById('recipeCard');
    const recipeContent = document.getElementById('recipeContent');

    // --- ГОЛОСОВОЙ ВВОД ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ru-RU';
        recognition.onstart = () => micBtn.classList.add('active');
        recognition.onend = () => micBtn.classList.remove('active');
        recognition.onresult = (e) => {
            mainInput.value = e.results[0][0].transcript;
            useMagicAI();
        };
    }
    function toggleVoice() { if(recognition) recognition.start(); else alert('Голос не поддерживается'); }
    
    // --- СТРЕЛКИ ПРОКРУТКИ ---
    function scrollTags(px) { document.getElementById('tagScroll').scrollLeft += px; }

    // --- НЕПРОБИВАЕМЫЙ ИИ АЛГОРИТМ ---
    async function useMagicAI(forceText = null) {
        const query = forceText || mainInput.value.trim();
        if (query.length < 2) return;

        const status = document.getElementById('aiStatus');
        status.style.display = 'block';

        try {
            // Строгий приказ ИИ выдавать только JSON
            const prompt = `Ты кулинарный бот. Запрос: "${query}". 
            Верни ТОЛЬКО JSON без слов, без маркдауна. Формат:
            {"items":[{"n": "Название продукта", "c": "Категория"}], "recipe": "Пошаговый текст рецепта"}`;

            const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`);
            const rawText = await response.text();
            
            let data = { items:[], recipe: "" };

            try {
                // Пытаемся вытащить JSON из ответа (даже если там есть мусорный текст)
                const start = rawText.indexOf('{');
                const end = rawText.lastIndexOf('}');
                
                if (start !== -1 && end !== -1) {
                    const jsonStr = rawText.substring(start, end + 1);
                    data = JSON.parse(jsonStr);
                } else {
                    throw new Error("В ответе нет JSON");
                }
            } catch (parseError) {
                console.warn("AI ошибся в формате. Включаем защиту.");
                // ЗАЩИТА: Если ИИ прислал не код, а просто текст рецепта, 
                // мы принудительно берем этот текст и показываем в синем окне!
                const cleanFallbackText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                data.recipe = cleanFallbackText;
                data.items =[{ n: query, c: "Рецепты" }];
            }

            // Добавление продуктов
            if (data.items && Array.isArray(data.items)) {
                data.items.forEach(i => pushItem(i.n, i.c, false));
            }

            // ГАРАНТИРОВАННЫЙ ВЫВОД РЕЦЕПТА
            if (data.recipe && data.recipe.length > 5) {
                currentRecipe = data.recipe;
                localStorage.setItem('sl_bulletproof_recipe', currentRecipe);
                showRecipeUI();
            }

            save();
            clearInput();
        } catch (e) {
            console.error("Глобальная ошибка сети:", e);
            if (!forceText) pushItem(query); // Спасаем запрос
        } finally {
            status.style.display = 'none';
        }
    }

    // --- ЛОГИКА СПИСКА ---
    function pushItem(name, cat = "Разное", shouldSave = true) {
        if (!name) return;
        items.push({
            id: Date.now() + Math.random(),
            name: name.charAt(0).toUpperCase() + name.slice(1),
            category: cat,
            done: false
        });
        const key = name.toLowerCase();
        history[key] = (history[key] || 0) + 1;
        if (shouldSave) save();
    }

    function manualAdd() {
        if (!mainInput.value.trim()) return;
        pushItem(mainInput.value.trim());
        clearInput();
    }

    function toggleDone(id) {
        items = items.map(i => i.id === id ? {...i, done: !i.done} : i);
        save();
    }

    function deleteItem(id) {
        items = items.filter(i => i.id !== id);
        save();
    }

    function save() {
        localStorage.setItem('sl_bulletproof_items', JSON.stringify(items));
        localStorage.setItem('sl_bulletproof_history', JSON.stringify(history));
        render();
    }

    function render() {
        const listEl = document.getElementById('list');
        listEl.innerHTML = '';
        [...items].sort((a,b) => a.done - b.done).forEach(item => {
            const li = document.createElement('li');
            li.className = `item ${item.done ? 'done' : ''}`;
            li.innerHTML = `
                <div class="item-info" onclick="toggleDone(${item.id})">
                    <span class="item-name">${item.name}</span>
                    <span class="item-cat">${item.category}</span>
                </div>
                <button class="btn-del" onclick="deleteItem(${item.id})">✕</button>
            `;
            listEl.appendChild(li);
        });
    }

    // --- УПРАВЛЕНИЕ СИНИМ ОКНОМ ---
    function showRecipeUI() {
        if (currentRecipe) {
            recipeContent.innerText = currentRecipe;
            recipeCard.style.display = 'block';
        } else {
            recipeCard.style.display = 'none';
        }
    }

    function closeRecipe() {
        currentRecipe = "";
        localStorage.removeItem('sl_bulletproof_recipe');
        showRecipeUI();
    }

    // --- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ---
    function clearInput() {
        mainInput.value = '';
        resetBtn.classList.remove('show');
        suggestBox.style.display = 'none';
    }

    mainInput.addEventListener('input', () => {
        resetBtn.classList.toggle('show', mainInput.value.length > 0);
        showSuggestions();
    });

    function showSuggestions() {
        const val = mainInput.value.toLowerCase().trim();
        if (val.length < 1) { suggestBox.style.display = 'none'; return; }
        const matches = Object.keys(history).filter(h => h.startsWith(val)).sort((a,b) => history[b] - history[a]).slice(0, 3);
        if (matches.length) {
            suggestBox.innerHTML = matches.map(m => `
                <div class="s-item" onclick="pushItem('${m}'); clearInput();">
                    <span>${m}</span>
                    <small>⭐ ${history[m]}</small>
                </div>
            `).join('');
            suggestBox.style.display = 'block';
        } else { suggestBox.style.display = 'none'; }
    }

    function fullReset() {
        if (confirm('Очистить весь список и закрыть рецепт?')) {
            items =[];
            closeRecipe();
            save();
        }
    }

    function addSet(type) {
        const sets = {
            breakfast: [['Яйца', 'Молочка'],['Кофе', 'Напитки'],['Хлеб', 'Выпечка']],
            bbq: [['Мясо', 'Мясо'],['Уголь', 'Разное'], ['Овощи', 'Овощи']],
            cleaning: [
                ['Мыло', 'Бытовая химия'],['Губки для мытья', 'Хозтовары'],
                ['Средство для полов', 'Бытовая химия'],['Средство для стекол', 'Бытовая химия'],['Мешки для мусора', 'Хозтовары'],
                ['Тряпки из микрофибры', 'Хозтовары'],['Чистящий порошок', 'Бытовая химия']
            ]
        };
        sets[type].forEach(s => pushItem(s[0], s[1], false));
        save();
    }

    function showStats() {
        const top = Object.entries(history).sort((a,b) => b[1] - a[1]).slice(0, 5).map(([n, c]) => `• ${n} (${c})`).join('\n');
        alert(top ? "Топ покупок:\n\n" + top : "История пуста");
    }

    mainInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') manualAdd(); });

    // Инициализация при старте
    render();
    showRecipeUI();
</script>

</body>
</html>
